description = ''

configurations {
    codegenImplementation
    codegenClasspath {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom codegenImplementation
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/generated/java'
        }
    }
    codegen {
        java {
            srcDir 'src/codegen/java'
        }
        resources {
            srcDir 'src/codegen/resources'
        }
    }
}

task genMain( type: JavaExec ) {
    mainClass = 'org.fix4j.spec.codegen.SpecParser'
    classpath = sourceSets.codegen.runtimeClasspath + configurations.codegenClasspath
    args = ['/FIX50SP2.xml', 'org.fix4j.spec.fix50sp2']
    workingDir = projectDir
}

clean.doFirst {
    delete "${projectDir}/src/generated"
}

dependencies {
  implementation project(':fix4j-assert-core')
  codegenImplementation project(':fix4j-assert-codegen')
}

compileJava.dependsOn(genMain)

tasks.named('processCodegenResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
