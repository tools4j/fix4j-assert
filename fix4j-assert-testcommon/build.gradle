apply plugin: 'groovy'

description = ''
dependencies {
    implementation(group: 'junit', name: 'junit', version:'4.11') {
        exclude(module: 'hamcrest-core')
    }
    implementation group: 'org.apache.groovy', name: 'groovy-all', version:'4.0.17'
    implementation group: 'org.apache.maven.surefire', name: 'surefire-junit4', version:'2.17'
    implementation(group: 'org.spockframework', name: 'spock-core', version:'2.3-groovy-4.0') {
        exclude(module: 'surefire-junit47')
    }
    testImplementation group: 'org.hamcrest', name: 'hamcrest-core', version:'1.3'
    testImplementation group: 'org.hamcrest', name: 'hamcrest-library', version:'1.3'
    testImplementation(group: 'org.mockito', name: 'mockito-core', version:'2.0.31-beta') {
        exclude(module: 'hamcrest-core')
    }
}
