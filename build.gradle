allprojects {
    apply plugin: 'groovy'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    group = 'org.fix4j'
    version = '1.6'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}

def deployUsername = hasProperty('ossrhUsername') ? ossrhUsername : 'not-given'
def deployPassword = hasProperty('ossrhPassword') ? ossrhPassword : 'not-given'

if (JavaVersion.current().isJava8Compatible()) {
    allprojects {
        tasks.withType(Javadoc) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
}

subprojects {
    apply plugin: 'java'
    sourceCompatibility = 17
    targetCompatibility = 17

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    repositories {
        mavenLocal()

        maven { url "https://repo.maven.apache.org/maven2" }
        maven { url "https://repo.marketcetera.org/maven" }
    }

    dependencies {
        implementation group: 'org.slf4j', name: 'slf4j-log4j12', version: '1.3.0'
        implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.3.0'
        testImplementation group: 'junit', name: 'junit', version: '4.11'
        testImplementation "org.spockframework:spock-core:2.3-groovy-4.0"
        // dependencies for using Spock
        testImplementation "org.hamcrest:hamcrest-core:1.3" // only necessary if Hamcrest matchers are used
        testRuntimeOnly "cglib:cglib-nodep:3.1"          // allows mocking of classes (in addition to interfaces)
        testRuntimeOnly "org.objenesis:objenesis:2.1"    // allows mocking of classes without default constructor (together with CGLIB)

    }

    task javadocJar(type: Jar) {
        archiveClassifier = 'javadoc'
        from javadoc
    }

    task sourcesJar(type: Jar) {
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }

    // Define the publications for the project
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifact sourcesJar
                artifact javadocJar

                pom {
                    name = 'Fix4j Assert'
                    packaging = 'jar'
                    artifactId = project.name
                    description = 'fix4j-assert is a library to assist in testing of applications using FIX protocol'
                    url = 'http://www.fix4j.org'

                    scm {
                        connection = 'scm:git:git://github.com/tools4j/groovy-tables.git'
                        developerConnection = 'scm:git:git@github.com:tools4j/fix4j-assert.git'
                        url = 'https://github.com/tools4j/fix4j-assert'
                    }

                    licenses {
                        license {
                            name = 'GNU General Public License (GPL)'
                            url = 'http://www.gnu.org/licenses/gpl.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'ben'
                            name = 'Ben Warner'
                            email = 'bjwarner@gmail.com'
                        }
                    }
                }
            }
        }
        
        repositories {
            maven {
                def releasesRepoUrl = "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
                def snapshotsRepoUrl = "https://oss.sonatype.org/content/repositories/snapshots/"
                url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
                credentials {
                    username = deployUsername
                    password = deployPassword
                }
            }
        }
    }
    
    // Configure signing to sign publications instead of configurations
    signing {
        required { gradle.taskGraph.hasTask("publish") }
        sign publishing.publications.mavenJava
    }
    
    // For backward compatibility, create a task that depends on the new publish task
    task uploadArchives(dependsOn: publish) {
        group = 'upload'
        description = 'Uploads all artifacts to Maven Central (redirects to publish task)'
    }
}

